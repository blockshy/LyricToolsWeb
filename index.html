    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Segoe UI', 'Google Sans Text', 'IBM Plex Sans', 'sans-serif'],
              mono: ['IBM Plex Mono', 'SFMono-Regular', 'Consolas', 'monospace'],

                900: '#0f172a',
                950: '#020617',
              }
            }
          },
        },
      }

    <style>
      ::-webkit-scrollbar {
        width: 11px;
        height: 11px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: rgba(26, 115, 232, 0.34);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(25, 103, 210, 0.5);
      }
      
      .dark ::-webkit-scrollbar-thumb {
        background-color: rgba(123, 170, 247, 0.34);
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(155, 188, 246, 0.5);
      }

      /* Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(26, 115, 232, 0.34) transparent;
      }
      .dark * {
        scrollbar-color: rgba(123, 170, 247, 0.34) transparent;
      }
    </style>
